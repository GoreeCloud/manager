schema_version: '0.4'

component:
  type: application
  id: goreecloud-manager
  product_name: GoreeCloud Manager
  repository: GoreeCloud/manager

lifecycle: development
version: 0.1.0-dev

supported_platforms:
  - web

api:
  versions: []
  endpoints:
    - name: health
      url: /healthz/
      purpose: Public process-liveness signal; not a production-readiness verdict.
    - name: readiness
      url: /readyz/
      purpose: Database-aware readiness signal kept separate from process liveness.
    - name: tasks-integration-health
      url: /healthz/integrations/tasks/
      purpose: Sanitized GoreeCloud Tasks integration monitoring signal.

platform_systems:
  manager:
    result: not-applicable-justified
    version: 0.1.0-dev
    evidence:
      - README.md
      - SPECIFICATIONS.md
      - docs/project-specification.md
    notes: This repository implements the GoreeCloud Manager authority itself; a separate Manager-to-Manager integration is not applicable.

  privacy_shield:
    result: applicable-migration-required
    version: null
    evidence:
      - core/privacy_views.py
      - integrations/privacy_shield.py
      - CAPABILITIES.md
    notes: A sanitized read-only status contract and authenticated surface exist, but current-contract runtime acceptance and production acceptance remain independently gated.

  wardveil_security:
    result: applicable-migration-required
    version: null
    evidence:
      - integrations/wardveil.py
      - tests/test_wardveil.py
      - docs/integrations/wardveil.md
      - CAPABILITIES.md
      - SECURITY.md
    notes: Manager now has a bounded source validator for the authoritative Wardveil Security State v2 contract pinned to Wardveil revision 9b41040ed48037451e660e860908316732384282. It validates evidence shape, protected/not-covered invariants, and protected-evidence freshness without authenticating producers or executing security controls. Live authenticated producer identity/delivery, evidence refresh, protection coverage, control execution, target-environment validation, and production acceptance remain outstanding.

  everkeep:
    result: applicable-migration-required
    version: null
    evidence:
      - integrations/everkeep.py
      - docs/project-specification.md
      - CAPABILITIES.md
    notes: Manager has a bounded Everkeep resilience-status integration and disposable recovery evidence, while target-environment recovery and current-contract acceptance remain outstanding.

  glaze_ui:
    result: applicable-migration-required
    version: '1.6.0'
    evidence:
      - docs/glaze-ui.md
      - core/static/core/css/glaze-ui.css
      - CAPABILITIES.md
    notes: Manager source now maps the authenticated interface to current Stable Glaze UI 1.6.0 through a bounded repository-local presentation layer. Rendered, keyboard/200% text/accessibility, representative-performance, rollback, deployed-equivalence, central consumer-registry, release, and production acceptance remain required; source adoption alone is not downstream conformance.

  mesh:
    result: applicable-migration-required
    version: null
    evidence:
      - integrations/mesh.py
      - tests/test_mesh.py
      - docs/integrations/mesh.md
      - CAPABILITIES.md
    notes: Manager now has a bounded source validator for current Mesh-authored coordination/governance evidence envelopes pinned to corrected Mesh revision 6bd0678faf94cbadcaaac7f2c31aa72ecca1b372. Live Mesh connectivity, service discovery, Identity-backed authentication, evidence delivery/refresh, target-environment validation, and production acceptance remain outstanding.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []

  identity:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - CAPABILITIES.md
    notes: Manager currently uses its local Django authentication/session foundation; GoreeCloud Identity adoption remains a separate platform migration.

  policy:
    result: applicable-migration-required
    version: null
    evidence:
      - integrations/policy.py
      - tests/test_policy.py
      - docs/integrations/policy.md
      - CAPABILITIES.md
    notes: Manager now has source-level request construction and decision-evidence validation for the authoritative GoreeCloud Policy v1 contracts pinned to Policy revision 46071886da37a6566b69cc923005eef64cce2bcc. No live authenticated decision exchange, policy distribution, freshness/expiry acceptance, enforcement coordination, target-environment evidence, or production acceptance is established.

  observability:
    result: applicable-migration-required
    version: null
    evidence:
      - integrations/observability.py
      - tests/test_observability.py
      - docs/integrations/observability.md
      - CAPABILITIES.md
    notes: Manager now has a source-level, privacy-minimized producer adapter for the authoritative GoreeCloud Observability v1 operational-signal contract pinned to Observability revision a7f6a65f442d3e517baddbe7b6ce7c250d142c8c. No live authenticated publication, collection, freshness/completeness acceptance, retention, alerting, target-environment evidence, or production acceptance is established.

health:
  health_endpoint: /healthz/
  readiness_endpoint: /readyz/

continuity:
  backup:
    required: true
    requirements:
      - Protect Manager persistent application state and non-reproducible configuration before production dependency.
      - Keep reusable secrets outside ordinary unapproved backup content while preserving approved recovery references.
  restore:
    required: true
    requirements:
      - Validate clean-environment restoration of Manager state, authentication, health, and required read-only integrations before production acceptance.
  export:
    required: true
    requirements:
      - Preserve an independently usable export or recovery path for Manager-owned durable state where applicable.
  portability:
    required: true
    requirements:
      - Keep Manager deployment and durable state reproducible without making Manager the sole source of recovery knowledge.

external_dependencies:
  - name: Django 5.2 LTS
    purpose: Server-side application, authentication, sessions, ORM, migrations, and templates.
    required: true
  - name: SQLite
    purpose: Development and initial-MVP Manager-owned application state.
    required: true

compatibility:
  platform_contract: '0.4'
  glaze_ui_required: '1.6.0'
  requires:
    - goreecloud-platform-contract==0.4
    - glaze-ui==1.6.0
  provides: []

evidence:
  acceptance_tests: []
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - README.md
    - SPECIFICATIONS.md
    - FEATURES.md
    - CAPABILITIES.md
    - IMPLEMENTED-FEATURES.md
    - PLANNED-FEATURES.md
    - CHANGELOGS.md
    - docs/project-specification.md
    - docs/glaze-ui.md
    - core/urls.py
    - integrations/privacy_shield.py
    - integrations/everkeep.py
    - integrations/wardveil.py
    - tests/test_wardveil.py
    - docs/integrations/wardveil.md
    - integrations/mesh.py
    - tests/test_mesh.py
    - docs/integrations/mesh.md
    - integrations/policy.py
    - tests/test_policy.py
    - docs/integrations/policy.md
    - integrations/observability.py
    - tests/test_observability.py
    - docs/integrations/observability.md
  blockers:
    - GoreeCloud Manager is still in Development and is not approved for production publication.
    - GoreeCloud Identity integration remains unaccepted.
    - Wardveil Security State v2 source validation is adopted, but authenticated producer identity/delivery, evidence refresh, protection-coverage acceptance, security-control boundaries, target-environment validation, and production acceptance remain outstanding.
    - GoreeCloud Mesh v1 source evidence validation is adopted, but live connectivity, discovery, Identity-backed authentication, evidence delivery/refresh, target-environment evidence, and production acceptance remain outstanding.
    - GoreeCloud Policy v1 source contracts are adopted, but live caller identity, authenticated decision exchange, distribution, freshness/expiry, enforcement coordination, obligations handling, target-environment evidence, and production acceptance remain outstanding.
    - GoreeCloud Observability v1 source contract is adopted for Manager-owned signal construction, but live producer identity, authenticated publication/collection, freshness/completeness, retention, diagnostics/alerting, target-environment evidence, and production acceptance remain outstanding.
    - GoreeCloud Sync remains separately governed; Manager-to-Sync integration and acceptance remain outstanding where applicable.
    - Manager source maps to current Stable Glaze UI 1.6.0, but repository-local source validation does not establish rendered/accessibility/performance, rollback, deployed-equivalence, central consumer-registry, release, production, or product Stable acceptance.
    - Full target-environment backup, restore, publication, deployment/rollback, and production-readiness acceptance remain outstanding.
    - Release approval and Stable qualification remain outstanding.
