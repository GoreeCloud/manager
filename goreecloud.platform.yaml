schema_version: '0.4'

component:
  type: application
  id: goreecloud-manager
  product_name: GoreeCloud Manager
  repository: GoreeCloud/manager

lifecycle: development
version: 0.1.0-dev

supported_platforms:
  - web

api:
  versions: []
  endpoints:
    - name: health
      url: /healthz/
      purpose: Public process-liveness signal; not a production-readiness verdict.
    - name: readiness
      url: /readyz/
      purpose: Database-aware readiness signal kept separate from process liveness.
    - name: tasks-integration-health
      url: /healthz/integrations/tasks/
      purpose: Sanitized GoreeCloud Tasks integration monitoring signal.

platform_systems:
  manager:
    result: not-applicable-justified
    version: 0.1.0-dev
    evidence:
      - README.md
      - SPECIFICATIONS.md
      - docs/project-specification.md
    notes: This repository implements the GoreeCloud Manager authority itself; a separate Manager-to-Manager integration is not applicable.

  privacy_shield:
    result: applicable-migration-required
    version: null
    evidence:
      - core/privacy_views.py
      - integrations/privacy_shield.py
      - CAPABILITIES.md
    notes: A sanitized read-only status contract and authenticated surface exist, but current-contract runtime acceptance and production acceptance remain independently gated.

  wardveil_security:
    result: applicable-blocked
    version: null
    evidence:
      - CAPABILITIES.md
      - SECURITY.md
    notes: No accepted Wardveil Security runtime integration is declared by the current Manager source baseline.

  everkeep:
    result: applicable-migration-required
    version: null
    evidence:
      - integrations/everkeep.py
      - docs/project-specification.md
      - CAPABILITIES.md
    notes: Manager has a bounded Everkeep resilience-status integration and disposable recovery evidence, while target-environment recovery and current-contract acceptance remain outstanding.

  glaze_ui:
    result: applicable-migration-required
    version: '1.6.0'
    evidence:
      - docs/glaze-ui.md
      - core/static/core/css/glaze-ui.css
      - CAPABILITIES.md
    notes: Manager source now maps the authenticated interface to current Stable Glaze UI 1.6.0 through a bounded repository-local presentation layer. Rendered, keyboard/200% text/accessibility, representative-performance, rollback, deployed-equivalence, central consumer-registry, release, and production acceptance remain required; source adoption alone is not downstream conformance.

  mesh:
    result: applicable-blocked
    version: null
    evidence:
      - CAPABILITIES.md
    notes: Manager-to-Mesh platform visibility and coordination integration remains unaccepted on authoritative main.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []

  identity:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - CAPABILITIES.md
    notes: Manager currently uses its local Django authentication/session foundation; GoreeCloud Identity adoption remains a separate platform migration.

  policy:
    result: applicable-blocked
    version: null
    evidence:
      - SPECIFICATIONS.md
      - CAPABILITIES.md
    notes: No accepted GoreeCloud Policy runtime contract, decision exchange, distribution, enforcement-coordination integration, or Manager-specific acceptance is established.

  observability:
    result: applicable-blocked
    version: null
    evidence:
      - SPECIFICATIONS.md
      - CAPABILITIES.md
    notes: Manager exposes local health and integration signals, but no accepted GoreeCloud Observability runtime contract, telemetry/evidence integration, freshness/completeness acceptance, or production evidence is established.

health:
  health_endpoint: /healthz/
  readiness_endpoint: /readyz/

continuity:
  backup:
    required: true
    requirements:
      - Protect Manager persistent application state and non-reproducible configuration before production dependency.
      - Keep reusable secrets outside ordinary unapproved backup content while preserving approved recovery references.
  restore:
    required: true
    requirements:
      - Validate clean-environment restoration of Manager state, authentication, health, and required read-only integrations before production acceptance.
  export:
    required: true
    requirements:
      - Preserve an independently usable export or recovery path for Manager-owned durable state where applicable.
  portability:
    required: true
    requirements:
      - Keep Manager deployment and durable state reproducible without making Manager the sole source of recovery knowledge.

external_dependencies:
  - name: Django 5.2 LTS
    purpose: Server-side application, authentication, sessions, ORM, migrations, and templates.
    required: true
  - name: SQLite
    purpose: Development and initial-MVP Manager-owned application state.
    required: true

compatibility:
  platform_contract: '0.4'
  glaze_ui_required: '1.6.0'
  requires:
    - goreecloud-platform-contract==0.4
    - glaze-ui==1.6.0
  provides: []

evidence:
  acceptance_tests: []
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - README.md
    - SPECIFICATIONS.md
    - FEATURES.md
    - CAPABILITIES.md
    - docs/project-specification.md
    - docs/glaze-ui.md
    - core/urls.py
    - integrations/privacy_shield.py
    - integrations/everkeep.py
  blockers:
    - GoreeCloud Manager is still in Development and is not approved for production publication.
    - GoreeCloud Mesh integration remains unaccepted.
    - GoreeCloud Identity integration remains unaccepted.
    - GoreeCloud Policy integration remains blocked pending an accepted platform runtime contract and Manager-specific evidence.
    - GoreeCloud Observability integration remains blocked pending an accepted platform runtime contract and Manager-specific evidence.
    - GoreeCloud Sync remains separately governed; Manager-to-Sync integration and acceptance remain outstanding where applicable.
    - Wardveil Security runtime integration and acceptance remain outstanding.
    - Manager source maps to current Stable Glaze UI 1.6.0, but repository-local source validation does not establish rendered/accessibility/performance, rollback, deployed-equivalence, central consumer-registry, release, production, or product Stable acceptance.
    - Full target-environment backup, restore, publication, deployment/rollback, and production-readiness acceptance remain outstanding.
    - Release approval and Stable qualification remain outstanding.
